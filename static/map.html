<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Drone Live Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    var map = L.map('map').setView([20, 0], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    var droneMarkers = {};

    async function fetchDroneData() {
      try {
        const res = await fetch("http://127.0.0.1:5000/data");
        const payload = await res.json();
        const drones = payload && payload.drones ? payload.drones : {};

        for (const [id, pos] of Object.entries(drones)) {
          if (!pos || typeof pos.lat !== "number" || typeof pos.lon !== "number") continue;

          if (!droneMarkers[id]) {
            droneMarkers[id] = L.marker([pos.lat, pos.lon], {
              icon: L.icon({
                iconUrl: "https://maps.gstatic.com/mapfiles/ms2/micons/red-dot.png",
                iconSize: [32, 32],
                iconAnchor: [16, 32],
                popupAnchor: [0, -32]
              })
            }).addTo(map).bindPopup(`Drone ${id}`);
          } else {
            droneMarkers[id].setLatLng([pos.lat, pos.lon]);
          }

          map.setView([pos.lat, pos.lon], 15);
        }
      } catch (e) {
        console.error("Error fetching data", e);
      }
    }

    setInterval(fetchDroneData, 1000);
  </script>
</body>
</html>
