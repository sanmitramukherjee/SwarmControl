[project]
name = "swarmcontrol"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "pymavlink>=2.4.40",
    "pyserial>=3.5",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E731"]

[tool.ty]
baseline = "ty-baseline.json"

[tool.ty.environment]
python-version = "3.8"

[dependency-groups]
dev = [
    "pre-commit>=3.5.0",
    "ruff>=0.17.4",
    "ty>=0.0.101",
]
